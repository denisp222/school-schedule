name: Public Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      SCHEDULE_SOLVER_WORKER: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: python -m pip --no-cache-dir install -r requirements-lock.txt
      - name: Check source history and release identity
        shell: pwsh
        run: |
          python tools/check_repository.py --history
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "from app.updates import channel; from app.version import VERSION; import os; assert channel()['repository']==os.environ['GITHUB_REPOSITORY']; assert os.environ['GITHUB_REF_TYPE']!='tag' or os.environ['GITHUB_REF_NAME']=='v'+VERSION"
      - name: Prepare official Windows prerequisites
        run: python tools/prepare_public_build.py
      - name: Test and build empty application
        run: python tools/build_application.py
      - name: Build and inspect public installer
        run: python tools/build_installer.py --without-voice
      - name: Verify installed app, reports, upgrade, and preservation
        run: python tools/verify_public_install.py
      - name: Sign update description
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: python -c "import json,subprocess,sys; p=json.load(open('docs/installer-build-lite.json',encoding='utf-8')); subprocess.run([sys.executable,'tools/release_manifest.py','--installer',p['file']],check=True)"
      - name: Publish checked files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/publish_release.py
