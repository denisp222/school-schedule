<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Расписание</title>
  <meta name="description" content="Школьное расписание и ежедневные замены на этом компьютере">
  <meta name="theme-color" content="#1d2b24">
  <script src="/static/startup.js?v=2.20.0"></script>
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/static/style.css?v=2.20.0">
  <link rel="stylesheet" href="/static/extras.css?v=2.20.0">
  <link rel="stylesheet" href="/static/technology-ui.css?v=2.20.0">
  <script src="/static/app.js?v=2.20.0" defer></script>
  <script src="/static/assistant.js?v=2.20.0" defer></script>
  <script src="/static/voice.js?v=2.20.0" defer></script>
  <script src="/static/extras.js?v=2.20.0" defer></script>
  <script src="/static/class-hours.js?v=2.20.0" defer></script>
  <script src="/static/technology-ui.js?v=2.20.0" defer></script>
</head>
<body>
  <button type="button" class="skip" data-action="skip">К расписанию</button>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Разделы приложения">
      <button type="button" class="brand" data-action="nav" data-page="day" aria-label="Расписание — на главную">
        <img src="/static/logo.svg" alt="" width="40" height="40">
        <span class="brand-text">
          <strong>Расписание</strong>
          <small id="brand-sub">школа · 2026/27</small>
        </span>
      </button>
      <nav class="nav" id="nav"></nav>
    </aside>

    <div class="content">
      <header class="topbar">
        <div class="crumb" id="crumb"></div>
        <div class="topbar-right">
          <span class="last-saved" id="last-saved" aria-live="polite"></span>
          <button type="button" class="btn small" data-action="save-project">Сохранить</button>
          <button type="button" class="btn ghost small" data-action="nav" data-page="help">Помощь</button>
          <span class="avatar" title="Рабочее место учителя" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 20V9l7-4 7 4v11"/><path d="M9.5 20v-5h5v5M12 5V2.5"/></svg>
          </span>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <div class="page">
          <div class="loading">
            <span class="skeleton wide"></span>
            <span class="skeleton"></span>
            <span class="skeleton tall"></span>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <dialog id="modal" class="modal" aria-labelledby="modal-title">
    <div class="modal-head">
      <div>
        <h2 id="modal-title"></h2>
        <div class="sub" id="modal-sub"></div>
      </div>
      <button type="button" class="close-x" data-action="close-modal" aria-label="Закрыть">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </dialog>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <form id="sheet-form" novalidate>
      <div class="modal-head">
        <div>
          <h2 id="sheet-title"></h2>
          <div class="sub" id="sheet-sub"></div>
        </div>
        <button type="button" class="close-x" data-action="close-sheet" aria-label="Закрыть">×</button>
      </div>
      <div class="modal-body" id="sheet-body"></div>
      <div class="modal-foot" id="sheet-foot"></div>
    </form>
  </dialog>

  <dialog id="confirm" class="modal small" aria-labelledby="confirm-title">
    <div class="modal-head">
      <div>
        <h2 id="confirm-title"></h2>
        <div class="sub" id="confirm-sub"></div>
      </div>
      <button type="button" class="close-x" data-action="confirm-no" aria-label="Закрыть">×</button>
    </div>
    <div class="modal-body" id="confirm-body"></div>
    <div class="modal-foot">
      <button type="button" class="btn ghost" data-action="confirm-no">Отмена</button>
      <button type="button" class="btn primary" id="confirm-yes" data-action="confirm-yes">Продолжить</button>
    </div>
  </dialog>

  <input type="file" id="import-file" accept=".json,application/json" hidden>
</body>
</html>
